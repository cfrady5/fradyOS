<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <title>FRADY</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #0e1014; color: #f4f4f5;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 320px; padding: 24px; text-align: center; }
      .mark { font-weight: 700; letter-spacing: 0.08em; font-size: 13px; color: #8b8b94; }
      h1 { margin: 20px 0 8px; font-size: 20px; font-weight: 600; }
      p { margin: 0 0 24px; color: #a1a1aa; }
      button {
        appearance: none; border: 1px solid #26262b; border-radius: 8px; background: #16161a; color: #f4f4f5;
        padding: 10px 18px; font: inherit; font-weight: 500; cursor: pointer;
      }
      button:active { background: #1e1e22; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">FRADY</div>
      <h1>You are offline</h1>
      <p>FRADY OS needs a connection to load your workspace. Reconnect and try again.</p>
      <button type="button" onclick="location.replace('https://frady-os.vercel.app/')">Try again</button>
    </main>
  </body>
</html>
